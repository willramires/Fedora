---
- name: Configurar Fedora
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Driver Nvidia
      ansible.builtin.import_tasks: tasks/000-nvidia.yml

    - name: Pacotes
      ansible.builtin.import_tasks: tasks/010-pacotes.yml

    - name: Flatpak
      ansible.builtin.import_tasks: tasks/020-flatpak.yml

    - name: GNOME
      ansible.builtin.import_tasks: tasks/030-gnome.yml

    - name: Extensões GNOME
      ansible.builtin.import_tasks: tasks/040-extensões-gnome.yml

    - name: OBS Studio
      ansible.builtin.import_tasks: tasks/050-obs.yml

    - name: Prism Launcher
      ansible.builtin.import_tasks: tasks/060-prism.yml

    - name: Spotify
      ansible.builtin.import_tasks: tasks/070-spotify.yml

    - name: Zen Browser
      ansible.builtin.import_tasks: tasks/80-zen.yml

    - name: VSCodium
      ansible.builtin.import_tasks: tasks/090-vscodium.yml

    - name: Serviços
      ansible.builtin.import_tasks: tasks/100-serviços.yml

    - name: Monitor
      ansible.builtin.import_tasks: tasks/110-monitor.yml
