---
- name: Configurar Fedora
  hosts: localhost
  connection: local
  become: true

  handlers:
    - name: Atualizar dconf
      ansible.builtin.command: dconf update

  tasks:
    - ansible.builtin.import_tasks: tasks/000-nvidia.yml
    - ansible.builtin.import_tasks: tasks/010-pacotes.yml
    - ansible.builtin.import_tasks: tasks/020-flatpak.yml
    - ansible.builtin.import_tasks: tasks/030-gnome.yml
    - ansible.builtin.import_tasks: tasks/040-extensões-gnome.yml
    - ansible.builtin.import_tasks: tasks/050-serviços.yml
    - ansible.builtin.import_tasks: tasks/060-brilho.yml
    - ansible.builtin.import_tasks: tasks/070-monitor.yml
    - ansible.builtin.import_tasks: tasks/080-zen.yml
    - ansible.builtin.import_tasks: tasks/090-outros.yml
