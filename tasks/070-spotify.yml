---
- name: Configurar Spotify
  vars:
    spotify_user: willramires
    spotify_home: "/home/willramires"
    spotify_config_root: "/home/willramires/.var/app/com.spotify.Client/config"
    spotify_bin_root: "/home/willramires/.local/bin"
    spotify_applications_root: "/home/willramires/.local/share/applications"
    spotify_flatpak_override_root: "/home/willramires/.local/share/flatpak/overrides"

  block:
    - name: Instalar dependencias do Spotify
      ansible.builtin.dnf:
        name:
          - wmctrl
          - desktop-file-utils
        state: present

    - name: Garantir diretorios do Spotify
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ spotify_user }}"
        group: "{{ spotify_user }}"
        mode: "0755"
      loop:
        - "{{ spotify_config_root }}"
        - "{{ spotify_bin_root }}"
        - "{{ spotify_applications_root }}"
        - "{{ spotify_flatpak_override_root }}"

    - name: Configurar flags do Spotify
      ansible.builtin.copy:
        dest: "{{ spotify_config_root }}/spotify-flags.conf"
        owner: "{{ spotify_user }}"
        group: "{{ spotify_user }}"
        mode: "0600"
        content: |
          --ozone-platform=x11

    - name: Configurar override Flatpak do Spotify
      ansible.builtin.copy:
        dest: "{{ spotify_flatpak_override_root }}/com.spotify.Client"
        owner: "{{ spotify_user }}"
        group: "{{ spotify_user }}"
        mode: "0644"
        content: |
          [Context]
          sockets=x11;

    - name: Instalar launcher maximizado do Spotify
      ansible.builtin.copy:
        dest: "{{ spotify_bin_root }}/spotify-maximized"
        owner: "{{ spotify_user }}"
        group: "{{ spotify_user }}"
        mode: "0755"
        content: |
          #!/bin/bash

          spotify_users="$HOME/.var/app/com.spotify.Client/config/spotify/Users"

          set_pref() {
              file="$1"
              key="$2"
              value="$3"
              tmp=$(mktemp)

              awk -v key="$key" -v value="$value" -F= '
                  BEGIN { found=0 }
                  $1 == key { print key "=" value; found=1; next }
                  { print }
                  END { if (!found) print key "=" value }
              ' "$file" > "$tmp" && mv "$tmp" "$file"
          }

          for prefs in "$spotify_users"/*/prefs; do
              [ -f "$prefs" ] || continue

              set_pref "$prefs" audio.sync_bitrate_enumeration 4
              set_pref "$prefs" audio.play_bitrate_non_metered_migrated true
              set_pref "$prefs" audio.normalize_v2 false
              set_pref "$prefs" audio.play_bitrate_non_metered_enumeration 4
              set_pref "$prefs" audio.play_bitrate_enumeration 4
              set_pref "$prefs" ui.hide_hpto true
          done

          flatpak run com.spotify.Client "$@" >/dev/null 2>&1 &
          spotify_pid=$!

          for i in {1..50}; do
              window_id=$(wmctrl -lx | awk 'tolower($0) ~ /spotify/ {print $1; exit}')

              if [ -n "$window_id" ]; then
                  sleep 0.3

                  if wmctrl -l | grep -qi "$window_id"; then
                      wmctrl -i -r "$window_id" -b add,maximized_vert,maximized_horz
                  fi

                  exit 0
              fi

              if ! kill -0 "$spotify_pid" 2>/dev/null; then
                  exit 0
              fi

              sleep 0.2
          done

          exit 0

    - name: Instalar entrada desktop do Spotify
      ansible.builtin.copy:
        dest: "{{ spotify_applications_root }}/com.spotify.Client.desktop"
        owner: "{{ spotify_user }}"
        group: "{{ spotify_user }}"
        mode: "0644"
        content: |
          [Desktop Entry]
          Name=Spotify
          Comment=Spotify
          Exec=/home/willramires/.local/bin/spotify-maximized %U
          Icon=com.spotify.Client
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;
          StartupNotify=false
          StartupWMClass=spotify
          MimeType=x-scheme-handler/spotify;
      register: spotify_desktop

    - name: Atualizar banco de dados desktop
      ansible.builtin.command:
        cmd: update-desktop-database "{{ spotify_applications_root }}"
      become_user: "{{ spotify_user }}"
      environment:
        HOME: "{{ spotify_home }}"
      when: spotify_desktop.changed
