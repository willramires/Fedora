---
- name: Configurar OBS Studio
  become: true
  become_user: willramires
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -e

      OBS_DIR="/home/willramires/.var/app/com.obsproject.Studio/config/obs-studio"
      PROFILE_DIR="$OBS_DIR/basic/profiles/Ansible-Geral"

      mkdir -p "$PROFILE_DIR"
      mkdir -p /home/willramires/Videos

      cat > "$OBS_DIR/global.ini" <<'EOF'
      [General]
      MaxLogs=10
      InfoIncrement=-1
      ProcessPriority=Normal
      EnableAutoUpdates=true
      BrowserHWAccel=true
      LastVersion=537001986

      [Video]
      Renderer=OpenGL

      [PropertiesWindow]
      cx=720
      cy=580

      [Basic]
      Profile=Ansible-Geral
      ProfileDir=Ansible-Geral
      EOF

      cat > "$PROFILE_DIR/basic.ini" <<'EOF'
      [General]
      Name=Ansible-Geral

      [Output]
      Mode=Advanced
      FilenameFormatting=%CCYY-%MM-%DD %hh-%mm-%ss
      DelayEnable=false
      DelaySec=20
      DelayPreserve=true
      Reconnect=true
      RetryDelay=2
      MaxRetries=25
      BindIP=default
      IPFamily=IPv4+IPv6
      NewSocketLoopEnable=false
      LowLatencyEnable=false

      [Stream1]
      IgnoreRecommended=false
      EnableMultitrackVideo=false
      MultitrackVideoMaximumAggregateBitrateAuto=true
      MultitrackVideoMaximumVideoTracksAuto=true

      [SimpleOutput]
      FilePath=/home/willramires/Videos
      RecFormat2=mkv
      VBitrate=6000
      ABitrate=192
      UseAdvanced=false
      Preset=veryfast
      NVENCPreset2=p5
      RecQuality=Small
      RecRB=false
      RecRBTime=20
      RecRBSize=512
      RecRBPrefix=Replay
      StreamAudioEncoder=aac
      RecAudioEncoder=aac
      RecTracks=1
      StreamEncoder=nvenc
      RecEncoder=nvenc

      [AdvOut]
      ApplyServiceSettings=true
      UseRescale=false
      TrackIndex=1
      VodTrackIndex=2
      Encoder=obs_x264
      RecType=Standard
      RecFilePath=/home/willramires/Videos
      RecFormat2=mkv
      RecUseRescale=false
      RecTracks=1
      RecEncoder=obs_nvenc_h264_tex
      FLVTrack=1
      StreamMultiTrackAudioMixes=1
      FFOutputToFile=true
      FFFilePath=/home/willramires/Videos
      FFVBitrate=6000
      FFVGOPSize=250
      FFUseRescale=false
      FFIgnoreCompat=false
      FFABitrate=192
      FFAudioMixes=1
      Track1Bitrate=192
      Track2Bitrate=160
      Track3Bitrate=160
      Track4Bitrate=160
      Track5Bitrate=160
      Track6Bitrate=160
      RecSplitFileTime=15
      RecSplitFileSize=2048
      RecRB=false
      RecRBTime=20
      RecRBSize=512
      AudioEncoder=libfdk_aac
      RecAudioEncoder=ffmpeg_aac
      RecFileNameWithoutSpace=true
      RecSplitFileType=Time
      FFFormat=
      FFFormatMimeType=
      FFVEncoderId=0
      FFVEncoder=
      FFAEncoderId=0
      FFAEncoder=

      [Video]
      BaseCX=1920
      BaseCY=1080
      OutputCX=1920
      OutputCY=1080
      FPSType=0
      FPSCommon=60
      FPSInt=30
      FPSNum=30
      FPSDen=1
      ScaleType=lanczos
      ColorFormat=NV12
      ColorSpace=709
      ColorRange=Partial
      SdrWhiteLevel=300
      HdrNominalPeakLevel=1000
      AutoRemux=true

      [Audio]
      MonitoringDeviceId=default
      MonitoringDeviceName=Default
      SampleRate=48000
      ChannelSetup=Stereo
      MeterDecayRate=23.53
      PeakMeterType=0
      EOF

      cat > "$PROFILE_DIR/recordEncoder.json" <<'EOF'
      {
        "rate_control": "CQP",
        "cqp": 21,
        "keyint_sec": 2,
        "preset2": "p5",
        "tune": "hq",
        "multipass": "qres",
        "profile": "high",
        "lookahead": false,
        "psycho_aq": true,
        "gpu": 0,
        "bf": 2
      }
      EOF
