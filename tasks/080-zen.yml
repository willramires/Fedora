---
- name: Configurar Zen Browser
  become_user: willramires
  vars:
    zen_root: /home/willramires/.var/app/app.zen_browser.zen/.zen
    zen_profile: "{{ zen_root }}/qk2beiy3.ansible-template"
    zen_application_ini: /var/lib/flatpak/app/app.zen_browser.zen/current/active/files/zen/application.ini
    zen_extensions:
      - filename: "78272b6fa58f4a1abaac99321d503a20@proton.me.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/proton-pass/latest.xpi"
      - filename: "harper@writewithharper.com.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/private-grammar-checker-harper/latest.xpi"
      - filename: "pt-BR@dictionaries.addons.mozilla.org.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/corretor/latest.xpi"
      - filename: "uBlock0@raymondhill.net.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
      - filename: "{74145f27-f039-47ce-a470-a662b129930a}.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/clearurls/latest.xpi"

  block:
    - name: Garantir diretório de perfis do Zen
      ansible.builtin.file:
        path: "{{ zen_root }}"
        state: directory
        mode: "0700"

    - name: Instalar template do perfil do Zen
      ansible.builtin.unarchive:
        src: "{{ playbook_dir }}/files/zen-profile-template.tar.gz"
        dest: "{{ zen_root }}"
        creates: "{{ zen_profile }}/prefs.js"

    - name: Marcar build instalada do Zen como já vista
      ansible.builtin.lineinfile:
        path: "{{ zen_profile }}/prefs.js"
        regexp: '^user_pref\("zen\.updates\.last-build-id",'
        line: 'user_pref("zen.updates.last-build-id", "{{ lookup("ansible.builtin.ini", "BuildID", section="App", file=zen_application_ini) }}");'

    - name: Instalar extensões do Zen
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ zen_profile }}/extensions/{{ item.filename }}"
        mode: "0644"
        force: false
        timeout: 60
      loop: "{{ zen_extensions }}"
      register: download
      until: download is succeeded
      retries: 5
      delay: 10
      loop_control:
        label: "{{ item.filename }}"
