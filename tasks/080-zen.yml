---
- name: Configurar Zen Browser
  become_user: "{{ usuario }}"
  vars:
    zen_src: "{{ playbook_dir }}/files/zen"
    zen_root: "{{ home }}/.var/app/app.zen_browser.zen/.zen"
    zen_perfis:
      - { dir: qk2beiy3.ansible-template, cor: "#3c0c6c" }
      - { dir: tom.ansible-template, cor: "#0b259a" }
    zen_application_ini: /var/lib/flatpak/app/app.zen_browser.zen/current/active/files/zen/application.ini
    zen_extensions:
      - filename: "78272b6fa58f4a1abaac99321d503a20@proton.me.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/proton-pass/latest.xpi"
      - filename: "harper@writewithharper.com.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/private-grammar-checker-harper/latest.xpi"
      - filename: "pt-BR@dictionaries.addons.mozilla.org.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/corretor/latest.xpi"
      - filename: "uBlock0@raymondhill.net.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
      - filename: "{74145f27-f039-47ce-a470-a662b129930a}.xpi"
        url: "https://addons.mozilla.org/firefox/downloads/latest/clearurls/latest.xpi"

  block:
    - name: Criar diretórios dos perfis do Zen
      ansible.builtin.file:
        path: "{{ zen_root }}/{{ item.dir }}/extensions"
        state: directory
        mode: "0700"
      loop: "{{ zen_perfis }}"

    - name: Instalar lista de perfis do Zen
      ansible.builtin.copy:
        src: "{{ zen_src }}/raiz/"
        dest: "{{ zen_root }}/"
        mode: "0600"
        directory_mode: "0700"
        force: false

    - name: Instalar estado inicial dos perfis do Zen
      ansible.builtin.copy:
        src: "{{ zen_src }}/perfil/"
        dest: "{{ zen_root }}/{{ item.dir }}/"
        mode: "0600"
        directory_mode: "0700"
        force: false
      loop: "{{ zen_perfis }}"

    - name: Instalar workspace com a cor de cada perfil do Zen
      ansible.builtin.copy:
        src: "{{ zen_src }}/sessoes/{{ item.dir }}.jsonlz4"
        dest: "{{ zen_root }}/{{ item.dir }}/zen-sessions.jsonlz4"
        mode: "0600"
        force: false
      loop: "{{ zen_perfis }}"

    - name: Configurar preferências dos perfis do Zen
      ansible.builtin.template:
        src: "{{ zen_src }}/user.js.j2"
        dest: "{{ zen_root }}/{{ item.dir }}/user.js"
        mode: "0600"
      loop: "{{ zen_perfis }}"

    - name: Marcar build instalada do Zen como já vista
      ansible.builtin.lineinfile:
        path: "{{ zen_root }}/{{ item.dir }}/prefs.js"
        regexp: '^user_pref\("zen\.updates\.last-build-id",'
        line: 'user_pref("zen.updates.last-build-id", "{{ lookup("ansible.builtin.ini", "BuildID", section="App", file=zen_application_ini) }}");'
      loop: "{{ zen_perfis }}"

    - name: Instalar extensões do Zen
      ansible.builtin.get_url:
        url: "{{ item.1.url }}"
        dest: "{{ zen_root }}/{{ item.0.dir }}/extensions/{{ item.1.filename }}"
        mode: "0644"
        force: false
        timeout: 60
      loop: "{{ zen_perfis | product(zen_extensions) | list }}"
      register: download
      until: download is succeeded
      retries: 5
      delay: 10
      loop_control:
        label: "{{ item.0.dir }}/{{ item.1.filename }}"
