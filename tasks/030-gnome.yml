---
- name: Criar diretório de wallpapers
  ansible.builtin.file:
    path: /usr/share/backgrounds/willramires
    state: directory
    mode: "0755"

- name: Instalar wallpaper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/wallpaper.png"
    dest: /usr/share/backgrounds/willramires/wallpaper.png
    mode: "0644"

- name: Configurar defaults do GNOME
  notify: Atualizar dconf
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/00-willramires
    mode: "0644"
    content: |
      [org/gnome/desktop/background]
      color-shading-type='solid'
      picture-options='zoom'
      picture-uri='file:///usr/share/backgrounds/willramires/wallpaper.png'
      picture-uri-dark='file:///usr/share/backgrounds/willramires/wallpaper.png'

      [org/gnome/desktop/interface]
      accent-color='purple'
      clock-show-weekday=true
      color-scheme='prefer-dark'
      enable-hot-corners=false
      icon-theme='Adwaita'

      [org/gnome/desktop/peripherals/mouse]
      accel-profile='flat'

      [org/gnome/desktop/privacy]
      report-technical-problems=true

      [org/gnome/desktop/screensaver]
      lock-enabled=true
      picture-options='zoom'
      picture-uri='file:///usr/share/backgrounds/willramires/wallpaper.png'

      [org/gnome/desktop/wm/keybindings]
      switch-applications=@as []
      switch-applications-backward=@as []
      switch-windows=['<Alt>Tab']
      switch-windows-backward=['<Shift><Alt>Tab']

      [org/gnome/desktop/wm/preferences]
      num-workspaces=1

      [org/gnome/mutter]
      center-new-windows=true
      dynamic-workspaces=false

      [org/gnome/settings-daemon/plugins/housekeeping]
      donation-reminder-enabled=false

      [org/gnome/settings-daemon/plugins/color]
      night-light-enabled=true
      night-light-schedule-automatic=false
      night-light-schedule-from=17.25
      night-light-schedule-to=5.0
      night-light-temperature=uint32 1000

      [org/gnome/settings-daemon/plugins/power]
      sleep-inactive-ac-timeout=0
      sleep-inactive-ac-type='nothing'
      sleep-inactive-battery-timeout=0
      sleep-inactive-battery-type='nothing'

      [org/gnome/shell]
      always-show-log-out=true
      favorite-apps=['org.gnome.Nautilus.desktop', 'app.zen_browser.zen.desktop', 'net.nokyan.Resources.desktop']

      [org/gnome/nautilus/preferences]
      default-folder-viewer='icon-view'
      default-sort-order='mtime'
      default-sort-in-reverse-order=true
      date-time-format='detailed'
      show-hidden-files=true

      [org/gnome/nautilus/icon-view]
      default-zoom-level='extra-large'
      captions=['date_modified', 'size', 'none']

      [org/gnome/nautilus/window-state]
      initial-size=(1600, 1000)
      maximized=false

      [org/gnome/nautilus/list-view]
      default-zoom-level='standard'
      default-visible-columns=['name', 'size', 'date_modified']
      default-column-order=['name', 'size', 'date_modified', 'type', 'date_modified_with_time', 'date_created', 'date_accessed', 'owner', 'group', 'permissions', 'mime_type', 'where', 'recency', 'starred']

      [org/gtk/settings/file-chooser]
      show-hidden=true

      [org/gtk/gtk4/settings/file-chooser]
      show-hidden=true

- name: Criar diretório de travas do dconf
  ansible.builtin.file:
    path: /etc/dconf/db/local.d/locks
    state: directory
    mode: "0755"

- name: Sempre abrir o Nautilus em janela de 1600x1000
  notify: Atualizar dconf
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/locks/nautilus
    mode: "0644"
    content: |
      /org/gnome/nautilus/window-state/initial-size
      /org/gnome/nautilus/window-state/maximized

- name: Criar diretório de configuração do logind
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    mode: "0755"

- name: Fechar a tampa do notebook sem suspender
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/tampa.conf
    mode: "0644"
    content: |
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore

- name: Instalar atalho que abre o Nautilus em Downloads
  ansible.builtin.copy:
    dest: /usr/local/bin/nautilus-downloads
    mode: "0755"
    content: |
      #!/usr/bin/bash
      exec nautilus --new-window "${@:-$HOME/Downloads}"

- name: Configurar arquivos do usuário
  become_user: "{{ usuario }}"
  block:
    - name: Criar diretórios do usuário
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ home }}/.cache/chromaleon"
        - "{{ home }}/.cache/fedora-config"
        - "{{ home }}/.config/autostart"
        - "{{ home }}/.config/gtk-3.0"
        - "{{ home }}/.config/systemd/user"
        - "{{ home }}/.local/share/applications"
        - "{{ home }}/.local/share/dbus-1/services"
        - "{{ home }}/.local/share/flatpak/overrides"
        - "{{ home }}/.var/app/net.nokyan.Resources/config/glib-2.0/settings"

    - name: Configurar favoritos do Nautilus
      ansible.builtin.copy:
        dest: "{{ home }}/.config/gtk-3.0/bookmarks"
        mode: "0644"
        content: |
          file://{{ home }}/Downloads
          file://{{ home }}/Pictures
          file://{{ home }}/Videos

    - name: Abrir o Nautilus em Downloads
      ansible.builtin.shell: >-
        sed -e 's/^DBusActivatable=true$/DBusActivatable=false/'
        -e 's|^Exec=nautilus --new-window|Exec=/usr/local/bin/nautilus-downloads|'
        /usr/share/applications/org.gnome.Nautilus.desktop
        > {{ home }}/.local/share/applications/org.gnome.Nautilus.desktop
      args:
        creates: "{{ home }}/.local/share/applications/org.gnome.Nautilus.desktop"

    - name: Configurar Resources
      ansible.builtin.copy:
        dest: "{{ home }}/.var/app/net.nokyan.Resources/config/glib-2.0/settings/keyfile"
        mode: "0644"
        content: |
          [net/nokyan/Resources]
          sidebar-details=true
          sidebar-meter-type='ProgressBar'

    - name: Configurar prompt roxo
      ansible.builtin.blockinfile:
        path: "{{ home }}/.bashrc"
        marker: "# {mark} ANSIBLE PROMPT"
        block: |
          PS1='\[\e[38;5;141m\]\u@\h\[\e[0m\]:\[\e[38;5;141m\]\w\[\e[0m\]\$ '
