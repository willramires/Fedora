---
- name: Instalar pipx
  ansible.builtin.dnf:
    name: pipx
    state: present

- name: Instalar gnome-extensions-cli
  become: true
  become_user: willramires
  ansible.builtin.command:
    cmd: pipx install gnome-extensions-cli --system-site-packages
    creates: /home/willramires/.local/bin/gext

- name: Instalar extensões GNOME
  become: true
  become_user: willramires
  ansible.builtin.command:
    cmd: >
      /home/willramires/.local/bin/gext --filesystem install
      just-perfection-desktop@just-perfection
      user-accent-colors@fabito02
      sound-percentage@subashghimire.info.np

- name: Baixar Gradia Capture
  become: true
  become_user: willramires
  ansible.builtin.git:
    repo: https://github.com/AlexanderVanhee/gradia-capture.git
    dest: /tmp/gradia-capture
    depth: 1
    force: true

- name: Compilar Gradia Capture
  become: true
  become_user: willramires
  ansible.builtin.command:
    cmd: ./build.sh
    chdir: /tmp/gradia-capture
    creates: /tmp/gradia-capture/gradia-integration@alexandervanhee.github.io.shell-extension.zip

- name: Criar diretório do Gradia Capture
  ansible.builtin.file:
    path: /home/willramires/.local/share/gnome-shell/extensions/gradia-integration@alexandervanhee.github.io
    state: directory
    owner: willramires
    group: willramires
    mode: '0755'

- name: Instalar Gradia Capture
  ansible.builtin.unarchive:
    src: /tmp/gradia-capture/gradia-integration@alexandervanhee.github.io.shell-extension.zip
    dest: /home/willramires/.local/share/gnome-shell/extensions/gradia-integration@alexandervanhee.github.io
    remote_src: true
    owner: willramires
    group: willramires

- name: Configurar extensões GNOME
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/20-extensions
    mode: '0644'
    content: |
      [org/gnome/shell]
      disable-user-extensions=false
      enabled-extensions=['just-perfection-desktop@just-perfection', 'user-accent-colors@fabito02', 'sound-percentage@subashghimire.info.np', 'gradia-integration@alexandervanhee.github.io']

      [org/gnome/shell/extensions/chromaleon]
      accent-color='#3c0c6c'
      custom-color=true
      recolor-apps=true
      recolor-folders=true

      [org/gnome/shell/extensions/just-perfection]
      activities-button=false
      dash-separator=false
      panel=false
      panel-in-overview=true
      quick-settings-airplane-mode=false
      quick-settings-backlight=false
      quick-settings-dark-mode=false
      quick-settings-do-not-disturb=false
      search=false
      show-apps-button=false
      support-notifier-type=0
      type-to-search=false
      window-preview-caption=false

- name: Atualizar dconf
  ansible.builtin.command:
    cmd: dconf update
