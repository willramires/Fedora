---
- name: Instalar extensões GNOME
  become_user: "{{ usuario }}"
  vars:
    cache_dir: "{{ home }}/.cache/fedora-config"
    gnome_versao: "{{ gnome_shell.stdout.split() | last }}"
    extensoes_ego:
      - just-perfection-desktop@just-perfection
      - sound-percentage@subashghimire.info.np
  block:
    - name: Ler versão do GNOME Shell
      ansible.builtin.command: gnome-shell --version
      register: gnome_shell
      changed_when: false

    - name: Baixar extensões do extensions.gnome.org
      ansible.builtin.get_url:
        url: "https://extensions.gnome.org/download-extension/{{ item }}.shell-extension.zip?shell_version={{ gnome_versao }}"
        dest: "{{ cache_dir }}/{{ item }}-gnome{{ gnome_versao.split('.') | first }}.zip"
        mode: "0644"
        timeout: 60
      loop: "{{ extensoes_ego }}"
      register: download
      until: download is succeeded
      retries: 5
      delay: 10

    - name: Instalar extensões do extensions.gnome.org
      ansible.builtin.command: gnome-extensions install --force {{ item.dest }}
      loop: "{{ download.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item is changed

    - name: Baixar Gradia Capture
      ansible.builtin.git:
        repo: https://github.com/AlexanderVanhee/gradia-capture.git
        dest: "{{ cache_dir }}/gradia-capture"
        depth: 1
      register: clone
      until: clone is succeeded
      retries: 5
      delay: 10

    - name: Instalar Gradia Capture
      ansible.builtin.command:
        cmd: ./build.sh -i
        chdir: "{{ cache_dir }}/gradia-capture"
      when: clone is changed

    - name: Deixar o destaque do Gradia Capture roxo
      ansible.builtin.replace:
        path: "{{ home }}/.local/share/gnome-shell/extensions/gradia-integration@alexandervanhee.github.io/stylesheet.css"
        regexp: -st-accent-color
        replace: "{{ cor_roxo }}"

- name: Ativar e configurar extensões GNOME
  notify: Atualizar dconf
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/20-extensions
    mode: "0644"
    content: |
      [org/gnome/shell]
      disable-extension-version-validation=true
      disable-user-extensions=false
      enabled-extensions=['just-perfection-desktop@just-perfection', 'sound-percentage@subashghimire.info.np', 'gradia-integration@alexandervanhee.github.io']

      [org/gnome/shell/extensions/just-perfection]
      activities-button=false
      dash-separator=false
      panel=false
      panel-in-overview=true
      quick-settings-airplane-mode=false
      quick-settings-backlight=false
      quick-settings-dark-mode=false
      quick-settings-do-not-disturb=false
      search=false
      show-apps-button=false
      support-notifier-type=0
      type-to-search=false
      window-preview-caption=false
