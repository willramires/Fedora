---
- name: Usar decoração de janela do GNOME no Spotify via XWayland
  ansible.builtin.command: flatpak override --system --nosocket=wayland --socket=x11 com.spotify.Client
  changed_when: false

- name: Configurar aplicativos do usuário
  become_user: "{{ usuario }}"
  vars:
    prism_dir: "{{ home }}/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher"
    spotify_dir: "{{ home }}/.var/app/com.spotify.Client/config/spotify/Users/315cgvok6a624lt4eelwnv6cojry-user"
    vscodium_dir: "{{ home }}/.var/app/com.vscodium.codium/config"
    obs_dir: "{{ home }}/.var/app/com.obsproject.Studio/config/obs-studio"
    steam_dir: "{{ home }}/.var/app/com.valvesoftware.Steam/.local/share/Steam/userdata/1245253870"

  block:
    - name: Criar diretórios de configuração dos aplicativos
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ prism_dir }}"
        - "{{ spotify_dir }}"
        - "{{ vscodium_dir }}/VSCodium/User"
        - "{{ obs_dir }}/basic/profiles/Untitled"
        - "{{ home }}/Videos"
        - "{{ steam_dir }}/config"
        - "{{ steam_dir }}/7/remote"

    - name: Instalar configuração inicial do Prism Launcher
      ansible.builtin.copy:
        dest: "{{ prism_dir }}/prismlauncher.cfg"
        mode: "0600"
        force: false
        content: |
          [General]
          ApplicationTheme=dark
          CloseAfterLaunch=true
          ConfigVersion=1.3
          FallbackMRBlockedMods=2
          IconTheme=pe_colored
          InstRenamingMode=PhysicalDir
          JProfilerPath=
          JvmArgs="-Dvoxy.geometryBufferSizeOverrideMB=1024"
          Language=en_US
          MCEditPath=
          MainWindowGeometry=AdnQywADAAAAAAAAAAAAAAAAAx8AAAJXAAAAAAAAAAAAAAMfAAACVwAAAAAAAAAABQAAAAAAAAAAAAAAAx8AAAJX
          MainWindowState="AAAA/wAAAAD9AAAAAAAAAyAAAAH3AAAABAAAAAQAAAAIAAAACPwAAAADAAAAAQAAAAEAAAAeAGkAbgBzAHQAYQBuAGMAZQBUAG8AbwBsAEIAYQByAgAAAAD/////AAAAAAAAAAAAAAACAAAAAQAAABYAbQBhAGkAbgBUAG8AbwBsAEIAYQByAQAAAAD/////AAAAAAAAAAAAAAADAAAAAQAAABYAbgBlAHcAcwBUAG8AbwBsAEIAYQByAQAAAAD/////AAAAAAAAAAA="
          PagedGeometry=AdnQywADAAAAAAAf////zwAAAuwAAAKsAAAAKgAAAAAAAALhAAACoQAAAAAAAAAABQAAAAAqAAAAAAAAAuEAAAKh
          ShowModIncompat=true
          StatusBarVisible=true
          UseSystemLocale=true
          WideBarVisibility_instanceToolBar="MTExMTExMTExLEJwQlFXSXVtciswQUJYRkVhclYwUjVuVTBpWT0="

    - name: Configurar preferências do Spotify antes do primeiro login
      ansible.builtin.copy:
        dest: "{{ spotify_dir }}/prefs"
        mode: "0600"
        content: |
          audio.play_bitrate_non_metered_migrated=true
          audio.play_bitrate_non_metered_enumeration=4
          audio.play_bitrate_enumeration=4
          audio.sync_bitrate_enumeration=4
          audio.allow_downgrade=false
          audio.normalize_v2=false
          ui.hide_hpto=true

    - name: Ocultar README inicial e aviso de atualização do SDK do VSCodium
      ansible.builtin.copy:
        dest: "{{ vscodium_dir }}/{{ item }}"
        mode: "0600"
        content: ""
        force: false
      loop:
        - flatpak-vscodium-first-run
        - flatpak-vscodium-sdk-update-25.08

    - name: Ocultar avisos do Restricted Mode do VSCodium
      ansible.builtin.copy:
        dest: "{{ vscodium_dir }}/VSCodium/User/settings.json"
        mode: "0600"
        backup: true
        content: |
          {
            "security.workspace.trust.banner": "never",
            "security.workspace.trust.startupPrompt": "never",
            "workbench.startupEditor": "none"
          }

    - name: Configurar OBS Studio
      ansible.builtin.copy:
        dest: "{{ obs_dir }}/global.ini"
        mode: "0600"
        content: |
          [General]
          MaxLogs=10
          InfoIncrement=-1
          ProcessPriority=Normal
          EnableAutoUpdates=true
          BrowserHWAccel=true
          LastVersion=537001986

          [Video]
          Renderer=OpenGL

          [PropertiesWindow]
          cx=720
          cy=580

    - name: Selecionar perfil Geral do OBS Studio
      ansible.builtin.copy:
        dest: "{{ obs_dir }}/user.ini"
        mode: "0600"
        content: |
          [Basic]
          Profile=Geral
          ProfileDir=Untitled

    - name: Configurar saída, vídeo e áudio do OBS Studio
      ansible.builtin.copy:
        dest: "{{ obs_dir }}/basic/profiles/Untitled/basic.ini"
        mode: "0600"
        content: |
          [General]
          Name=Geral

          [Output]
          Mode=Advanced
          FilenameFormatting=%CCYY-%MM-%DD %hh-%mm-%ss
          DelayEnable=false
          DelaySec=20
          DelayPreserve=true
          Reconnect=true
          RetryDelay=2
          MaxRetries=25
          BindIP=default
          IPFamily=IPv4+IPv6
          NewSocketLoopEnable=false
          LowLatencyEnable=false

          [Stream1]
          IgnoreRecommended=false
          EnableMultitrackVideo=false
          MultitrackVideoMaximumAggregateBitrateAuto=true
          MultitrackVideoMaximumVideoTracksAuto=true

          [SimpleOutput]
          FilePath={{ home }}/Videos
          RecFormat2=mkv
          VBitrate=6000
          ABitrate=192
          UseAdvanced=false
          Preset=veryfast
          NVENCPreset2=p5
          RecQuality=Small
          RecRB=false
          RecRBTime=20
          RecRBSize=512
          RecRBPrefix=Replay
          StreamAudioEncoder=aac
          RecAudioEncoder=aac
          RecTracks=1
          StreamEncoder=nvenc
          RecEncoder=nvenc

          [AdvOut]
          ApplyServiceSettings=true
          UseRescale=false
          TrackIndex=1
          VodTrackIndex=2
          Encoder=obs_x264
          RecType=Standard
          RecFilePath={{ home }}/Videos
          RecFormat2=mkv
          RecUseRescale=false
          RecTracks=1
          RecEncoder=obs_nvenc_h264_tex
          FLVTrack=1
          StreamMultiTrackAudioMixes=1
          FFOutputToFile=true
          FFFilePath={{ home }}/Videos
          FFVBitrate=6000
          FFVGOPSize=250
          FFUseRescale=false
          FFIgnoreCompat=false
          FFABitrate=192
          FFAudioMixes=1
          Track1Bitrate=192
          Track2Bitrate=160
          Track3Bitrate=160
          Track4Bitrate=160
          Track5Bitrate=160
          Track6Bitrate=160
          RecSplitFileTime=15
          RecSplitFileSize=2048
          RecRB=false
          RecRBTime=20
          RecRBSize=512
          AudioEncoder=libfdk_aac
          RecAudioEncoder=ffmpeg_aac
          RecFileNameWithoutSpace=true
          RecSplitFileType=Time
          FFFormat=
          FFFormatMimeType=
          FFVEncoderId=0
          FFVEncoder=
          FFAEncoderId=0
          FFAEncoder=

          [Video]
          BaseCX=1920
          BaseCY=1080
          OutputCX=1920
          OutputCY=1080
          FPSType=0
          FPSCommon=60
          FPSInt=30
          FPSNum=30
          FPSDen=1
          ScaleType=lanczos
          ColorFormat=NV12
          ColorSpace=709
          ColorRange=Partial
          SdrWhiteLevel=300
          HdrNominalPeakLevel=1000
          AutoRemux=true

          [Audio]
          MonitoringDeviceId=default
          MonitoringDeviceName=Default
          SampleRate=48000
          ChannelSetup=Stereo
          MeterDecayRate=23.53
          PeakMeterType=0

    - name: Configurar encoder de gravação do OBS Studio
      ansible.builtin.copy:
        dest: "{{ obs_dir }}/basic/profiles/Untitled/recordEncoder.json"
        mode: "0600"
        content: |
          {
            "rate_control": "CQP",
            "cqp": 21,
            "keyint_sec": 2,
            "preset2": "p5",
            "tune": "hq",
            "multipass": "qres",
            "profile": "high",
            "lookahead": false,
            "psycho_aq": true,
            "gpu": 0,
            "bf": 2
          }

    - name: Sem overlay, chat nem avisos de amigos e sem popup da loja antes do primeiro login
      ansible.builtin.copy:
        dest: "{{ steam_dir }}/config/localconfig.vdf"
        mode: "0600"
        force: false
        content: |
          "UserLocalConfigStore"
          {
          	"friends"
          	{
          		"SignIntoFriends"		"0"
          		"Notifications_ShowIngame"		"0"
          		"Sounds_PlayIngame"		"0"
          		"Notifications_ShowOnline"		"0"
          		"Sounds_PlayOnline"		"0"
          	}
          	"News"
          	{
          		"NotifyAvailableGames"		"0"
          	}
          	"system"
          	{
          		"EnableGameOverlay"		"0"
          	}
          }

    - name: Abrir na Biblioteca, relógio 24h e sem avisos de amigos antes do primeiro login
      ansible.builtin.copy:
        dest: "{{ steam_dir }}/7/remote/sharedconfig.vdf"
        mode: "0600"
        force: false
        content: |
          "UserRoamingConfigStore"
          {
          	"Software"
          	{
          		"Valve"
          		{
          			"Steam"
          			{
          				"SteamDefaultDialog"		"#app_games"
          				"FriendsUI"
          				{
          					"FriendsUIJSON"		"{\"bSignIntoFriends\":false,\"bNotifications_ShowIngame\":false,\"bSounds_PlayIngame\":false,\"bNotifications_ShowOnline\":false,\"bSounds_PlayOnline\":false,\"b24HourClock\":true}"
          				}
          			}
          		}
          	}
          }

    - name: Ajustar configuração já existente da Steam
      ansible.builtin.replace:
        path: "{{ steam_dir }}/{{ item.file }}"
        regexp: "{{ item.regexp }}"
        replace: "{{ item.replace }}"
      loop:
        - file: config/localconfig.vdf
          regexp: '("(?:SignIntoFriends|NotifyAvailableGames|EnableGameOverlay|(?:Notifications_Show|Sounds_Play)(?:Ingame|Online))"\s+)"1"'
          replace: '\1"0"'
        - file: 7/remote/sharedconfig.vdf
          regexp: '("SteamDefaultDialog"\s+)"[^"]*"'
          replace: '\1"#app_games"'
        - file: 7/remote/sharedconfig.vdf
          regexp: '((?:bSignIntoFriends|b(?:Notifications_Show|Sounds_Play)(?:Ingame|Online))\\":)true'
          replace: '\1false'
        - file: 7/remote/sharedconfig.vdf
          regexp: '(b24HourClock\\":)false'
          replace: '\1true'
      loop_control:
        label: "{{ item.file }}"
